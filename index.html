<title>Moon Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Noto+Sans+Georgian:wght@400;600;800&display=swap">
<style>
/* Layout: one full-bleed portrait rink drawn on canvas; glass panels float above it for menus. */
:root{
  color-scheme:dark;
  --bg:#05070f;
  --ink:#f2f4ff;
  --dim:#8d94b8;
  --faint:#5d6588;
  --line:rgba(255,255,255,.09);
  --glass:rgba(16,20,38,.66);
  --ice:#ffb13b;
  --ember:#a9c8ff;
  --rose:#ff3d6e;
  --violet:#a98bff;
  --display:'Unbounded','Noto Sans Georgian',system-ui,sans-serif;
  --body:'Noto Sans Georgian',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* in-game pause */
#pauseBtn{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(14,18,34,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.45);display:grid;place-items:center;padding:0;cursor:pointer;z-index:4;color:var(--ink)}
#pauseBtn svg{width:16px;height:16px}
#pauseBtn:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

/* screens */
.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:28px;padding-inline:16px;overflow-y:auto;touch-action:pan-y;background:none;z-index:6;will-change:opacity}
.panel{will-change:transform}
#backdrop{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s cubic-bezier(.2,.8,.2,1);will-change:opacity;background:radial-gradient(90% 60% at 50% 30%,rgba(60,40,120,.22),transparent 70%),linear-gradient(180deg,rgba(3,4,10,.55),rgba(3,4,10,.88))}
#backdrop.on{opacity:1}
.panel{width:100%;max-width:392px;display:flex;flex-direction:column;gap:13px}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:6px;text-align:center}
.emblem{width:66px;height:66px;border-radius:50%;position:relative;background:#cfd2d8 center/cover no-repeat;box-shadow:0 0 30px rgba(190,210,255,.55),0 0 80px rgba(169,200,255,.25)}
.emblem::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--ice);border-right-color:rgba(255,177,59,.3);animation:orbit 3.2s linear infinite}
.emblem::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid transparent;border-bottom-color:var(--ember);border-left-color:rgba(169,200,255,.3);animation:orbit 3.2s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.logo{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,12.5vw,58px);line-height:.95;letter-spacing:-.02em;text-wrap:balance;background:linear-gradient(100deg,#ffd27a 0%,#ffffff 48%,#cfe0ff 72%,#8fb4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(169,139,255,.35))}
.logoimg{margin:0 -12px;width:calc(100% + 24px);max-width:460px;line-height:0}
.logoimg img{display:block;width:100%;height:auto;animation:logoIn .8s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes logoIn{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.logoimg img{display:block;width:100%;height:auto;animation:logoIn .8s cubic-bezier(.2,.9,.3,1.15) both}}
.tag{margin:0;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
.h2{margin:0;font-family:var(--body);font-weight:800;font-size:26px;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{margin:0;font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}

/* buttons */
.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px 12px 12px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02)),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 28px -14px rgba(0,0,0,.8);color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:transform .14s ease,border-color .2s,box-shadow .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
@media (hover:hover) and (pointer:fine){.btn:hover::after{transform:translateX(120%)}.btn:hover{border-color:rgba(255,255,255,.2)}}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.btn .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn .ic svg{width:22px;height:22px}
.btn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.btn .tx b{font-weight:800;font-size:17px;letter-spacing:-.005em}
.btn .tx small{font-size:12.5px;color:var(--dim);font-weight:600}
.btn .chev{flex:none;width:18px;height:18px;opacity:.55}
.btn.primary{border-color:transparent;background:linear-gradient(120deg,#ff9f3a 0%,#ff6a55 38%,#8a5cff 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12),0 14px 34px -10px rgba(170,90,255,.6)}
.btn.primary .ic{background:rgba(255,255,255,.2)}
.btn.primary .tx small{color:rgba(255,255,255,.85)}
.btn.primary .chev{opacity:.9}
.btn.compact{min-height:54px;border-radius:16px;padding:8px 14px 8px 8px}
.btn.compact .ic{width:38px;height:38px;border-radius:12px}
.btn.compact .tx b{font-size:15.5px}
.btn.center{justify-content:center;padding:14px}
.btn.center .tx{flex:none;align-items:center}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* settings card */
.card{border-radius:20px;border:1px solid var(--line);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);padding:4px 16px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;font-weight:600;font-size:14.5px}
.set + .set{border-top:1px solid var(--line)}
.ios-tip span{font-size:12px;font-weight:600;color:var(--dim);line-height:1.45;padding-block:10px}
.sw{appearance:none;flex:none;position:relative;width:46px;height:28px;border-radius:999px;border:0;padding:0;cursor:pointer;background:#2a3050;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked="true"]{background:linear-gradient(120deg,#7b61ff,#a98bff)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

/* difficulty */
.top-row{display:flex;align-items:center;gap:12px}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}
.back:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;padding:14px 14px 13px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 55%),var(--glass);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.dcard:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.dcard[aria-checked="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 32px -12px var(--c),inset 0 0 24px -12px var(--c)}
.meter{display:flex;gap:3px;align-items:flex-end;height:14px}
.meter i{display:block;width:5px;border-radius:2px;background:rgba(255,255,255,.14)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:8px}.meter i:nth-child(3){height:11px}.meter i:nth-child(4){height:14px}
.meter i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.dn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--c)}
.dd{font-size:12.5px;font-weight:600;color:#c7cce6;line-height:1.35}
.wr{display:flex;align-items:center;gap:8px;width:100%;font-family:var(--display);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.wr .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.wr .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{appearance:none;border:0;border-radius:10px;min-height:36px;background:transparent;color:var(--dim);font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg button:focus-visible{outline:2px solid var(--violet)}
.seglbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:-6px;padding-inline:4px}

/* scoreboards */
.score{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--display);font-weight:800;font-size:clamp(52px,16vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.score .a{color:var(--ice);text-shadow:0 0 26px rgba(255,177,59,.55)}
.score .b{color:var(--ember);text-shadow:0 0 26px rgba(169,200,255,.6)}
.score .x{font-size:.4em;color:var(--faint)}
.who{display:flex;justify-content:center;gap:56px;font-size:12px;font-weight:600;color:var(--dim);margin-top:-6px}
.center-text{text-align:center}
.stats{display:grid;grid-template-columns:1fr auto auto;column-gap:18px;row-gap:0;padding:6px 16px}
.stats div{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.stats .h{border-top:0;font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:500}
.stats .n{text-align:right;font-family:var(--display);font-weight:700;font-size:14px}
.stats .ca{color:var(--ice)} .stats .cb{color:var(--ember)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:16px;border:1px solid var(--line);background:var(--glass);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim);font-weight:600}

/* skin picker */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{display:flex;flex-direction:column;gap:3px;min-width:0;padding:7px 7px 10px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.skin:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.skin[aria-checked="true"]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 12px 30px -12px var(--violet)}
.skin b{font-size:14px;font-weight:800;padding:4px 5px 0}
.skin small{font-size:11.5px;font-weight:600;color:var(--dim);padding:0 5px;line-height:1.3}
.pv{position:relative;display:block;height:58px;border-radius:12px;overflow:hidden}
.pv::before,.pv::after{content:"";position:absolute;border-radius:50%}
.pv-cosmic{background:radial-gradient(70% 90% at 30% 40%,rgba(150,70,190,.55),transparent 70%),radial-gradient(60% 80% at 80% 70%,rgba(50,90,200,.5),transparent 70%),#05060f}
.pv-cosmic::before{width:18px;height:18px;left:22%;top:7px;background:radial-gradient(circle at 40% 40%,#fff3c4,#ffb13b 55%,#d96a10);box-shadow:0 0 12px 3px rgba(255,170,60,.7)}
.pv-cosmic::after{width:18px;height:18px;right:22%;bottom:7px;background:radial-gradient(circle at 40% 38%,#f2f2f0,#c3c5ca 60%,#8b8e96);box-shadow:0 0 10px 2px rgba(190,210,255,.5)}
.pv-neon{background:linear-gradient(180deg,#071222,#0a0b1c 50%,#1a0d14);box-shadow:inset 0 3px 0 #38e1ff,inset 0 -3px 0 #ff6b3d}
.pv-neon::before{width:14px;height:14px;left:24%;top:9px;border:3px solid #38e1ff;background:#121829;box-shadow:0 0 10px #38e1ff}
.pv-neon::after{width:14px;height:14px;right:24%;bottom:9px;border:3px solid #ff6b3d;background:#121829;box-shadow:0 0 10px #ff6b3d}
.label-row{font-size:13px;font-weight:600;color:var(--dim);padding-inline:4px;margin-bottom:-6px}

/* neon skin overrides (cosmic is the default above) */
:root[data-skin="neon"]{--ice:#38e1ff;--ember:#ff6b3d}
:root[data-skin="neon"] .score .a{text-shadow:0 0 26px rgba(56,225,255,.55)}
:root[data-skin="neon"] .score .b{text-shadow:0 0 26px rgba(255,107,61,.55)}
:root[data-skin="neon"] .emblem{width:62px;height:62px;background:radial-gradient(circle at 38% 34%,#fff 0 10%,#e8e3ff 22%,#b69cff 60%,#5a3fd6 100%)!important;box-shadow:0 0 0 5px rgba(169,139,255,.12),0 0 34px rgba(169,139,255,.55)}
:root[data-skin="neon"] .emblem::after{border-right-color:rgba(56,225,255,.3)}
:root[data-skin="neon"] .emblem::before{border-left-color:rgba(255,107,61,.3)}
:root[data-skin="neon"] .logo{background:linear-gradient(100deg,#8ff0ff 0%,#ffffff 45%,#ffb08f 70%,#ff6b8e 100%);-webkit-background-clip:text;background-clip:text}
:root[data-skin="neon"] .btn.primary{background:linear-gradient(120deg,#ff8a3d 0%,#ff5a4e 45%,#ff3d7a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12),0 14px 34px -10px rgba(255,80,80,.65)}

/* tactile press: quick squash on touch, springy release, light ripple from the finger */
.btn,.dcard,.skin,.back,.seg button,.sw,#pauseBtn{transition:transform .22s cubic-bezier(.2,.8,.25,1);-webkit-user-select:none;user-select:none}
.dcard,.skin,.back,.seg button{position:relative;overflow:hidden}
.is-press{transform:scale(.97)!important;transition:transform .07s ease-out!important}
.sw.is-press{transform:scale(.94)!important}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.32),rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 70%);transform:scale(.1);opacity:1;animation:rip .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* screen transitions */
.screen.entering{animation:scrIn .3s cubic-bezier(.2,.8,.2,1) both}
.screen.entering .panel{animation:panelIn .38s cubic-bezier(.2,.85,.25,1) both}
.screen.leaving{animation:scrOut .18s ease-in both;pointer-events:none}
.screen.leaving .panel{animation:panelOut .18s ease-in both}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
@keyframes scrOut{to{opacity:0}}
@keyframes panelIn{from{transform:translateY(14px) scale(.99)}to{transform:none}}
@keyframes panelOut{to{transform:translateY(-6px) scale(.99)}}
@media (prefers-reduced-motion:reduce){.screen.entering,.screen.entering .panel,.screen.leaving,.screen.leaving .panel,.ripple{animation-duration:.01s!important}}

@media (max-width:350px){.dgrid,.btns2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.emblem::before,.emblem::after{animation:none}.btn,.btn::after,.dcard{transition:none}}
</style>

function rgba(h,a){ const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

let inited = false;
function layout(){

  tube = 1.25*u; const inset = 1.7*u;

  cx = (L+R)/2; mid = (T+B)/2; rm = 8.2*u; rp = 4.2*u; gw = 19.5*u;
  if (snap) [puck,top,bot].forEach((o,i) => { const s = snap[i]; o.x = L+s.x*(R-L); o.y = T+s.y*(B-T); o.vx = s.vx*u; o.vy = s.vy*u; });

  inited = true; menuDirty = true;
}

const PMAX = 900;
const pX = new Float32Array(PMAX), pY = new Float32Array(PMAX), pVX = new Float32Array(PMAX), pVY = new Float32Array(PMAX),
      pL = new Float32Array(PMAX), pM = new Float32Array(PMAX), pS = new Float32Array(PMAX), pC = new Uint8Array(PMAX);
let pN = 0;
function spawn(x, y, c, n, spd, size, life, nx = 0, ny = 0, spread = TAU){
  const base = (nx || ny) ? Math.atan2(ny, nx) : 0;
  for (let i = 0; i < n && pN < PMAX; i++) {
    const a = base + (Math.random()-.5)*spread, s = spd*u*(.2+Math.random()*.8);
    pX[pN] = x; pY[pN] = y; pVX[pN] = Math.cos(a)*s; pVY[pN] = Math.sin(a)*s;
    pM[pN] = pL[pN] = life*(.55+Math.random()*.6); pS[pN] = size*u*(.55+Math.random()*.8); pC[pN] = c; pN++;
  }
}
function updParticles(dt){
  const fr = Math.exp(-3*dt);
  for (let i = 0; i < pN;) {
    pL[i] -= dt;
    if (pL[i] <= 0) { pN--; pX[i]=pX[pN]; pY[i]=pY[pN]; pVX[i]=pVX[pN]; pVY[i]=pVY[pN]; pL[i]=pL[pN]; pM[i]=pM[pN]; pS[i]=pS[pN]; pC[i]=pC[pN]; continue; }
    pVX[i] *= fr; pVY[i] *= fr; pX[i] += pVX[i]*dt; pY[i] += pVY[i]*dt; i++;
  }
}

let fpsVal = 0, fpsAcc = 0, fpsFrames = 0, lastTick = 4;

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  let sx = 0, sy = 0;
  if (shake > .02) { sx = rnd(shake*1.4*u); sy = rnd(shake*1.4*u); ctx.fillStyle = '#03040a'; ctx.fillRect(0,0,W,H); }
  ctx.drawImage(bgC, sx, sy, W, H);
  ctx.translate(sx, sy);

  // score watermarks inside each half
  const pvp = S.mode === 'pvp', wmA = S.mode === 'demo' ? .05 : .085;
  drawText(textSpr(String(top.score), 30*u, COL.top, false), cx, (T + mid)/2, pvp, wmA);
  drawText(textSpr(String(bot.score), 30*u, COL.bot, false), cx, (B + mid)/2, false, wmA);

  // additive layer
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#ffffff';
  for (const t of twinkle) { const a = .5 + .5*Math.sin(clock*t.f + t.p); ctx.globalAlpha = a*a*.85; const s = t.s*(.6 + a*.6); ctx.drawImage(spr.dots[3], t.x - s*3, t.y - s*3, s*6, s*6); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let q = 0; q < 4; q++) {
    const f = qFlash[q]; if (f < .02) continue; const p = quads[q].p;
    ctx.strokeStyle = quads[q].col;
    ctx.globalAlpha = f*.2; ctx.lineWidth = tube*4.5; ctx.stroke(p);
    ctx.globalAlpha = f*.5; ctx.lineWidth = tube*1.8; ctx.stroke(p);
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = f*.85; ctx.lineWidth = tube*.5; ctx.stroke(p);
  }
  if (ring && ring.t < .75) {
    const k = ring.t/.75; ctx.globalAlpha = (1-k)*.9; ctx.strokeStyle = COL.puck; ctx.lineWidth = .6*u;
    ctx.beginPath(); ctx.arc(ring.x, ring.y, rp*(1.2 + k*4.5), 0, TAU); ctx.stroke();
  }
  for (let i = 0; i < pN; i++) {
    const a = pL[i]/pM[i], s = pS[i]*(.45 + .55*a);
    ctx.globalAlpha = a; ctx.drawImage(spr.dots[pC[i]], pX[i]-s, pY[i]-s, s*2, s*2);
  }
  if (puckVisible && trailN > 1) {
    const sp = Math.hypot(puck.vx, puck.vy)/u, ka = clamp((sp - 60)/320, 0, 1)*.6;
    if (ka > .01) for (let j = 1; j < trailN; j++) {
      const idx = ((trailHead - 1 - j + TR*2) % TR)*2, a = 1 - j/trailN, s = rp*1.6*a;
      ctx.globalAlpha = ka*a; ctx.drawImage(spr.halo.puck, trail[idx]-s, trail[idx+1]-s, s*2, s*2);
    }
  }
  for (const m of [top,bot]) if (m.flash > .02) {
    const s = rm*(2.6 + m.flash*.8); ctx.globalAlpha = m.flash*.75;
    ctx.drawImage(m === top ? spr.halo.top : spr.halo.bot, m.x - s, m.y - s, s*2, s*2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // 7-second rule ring around the puck
  if (puckActive && halfT > 3 && S.mode !== 'demo') {
    const k = clamp((halfT - 3)/(RULE_SECONDS - 3), 0, 1), col = halfOwner === top ? COL.top : COL.bot;
    ctx.strokeStyle = col; ctx.globalAlpha = .35 + .5*k; ctx.lineWidth = .7*u;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, rp*1.9, -Math.PI/2, -Math.PI/2 + TAU*(1-k)); ctx.stroke(); ctx.globalAlpha = 1;
  }

  // bodies: the Sun (top) with its corona, the Moon (bottom), then the star-puck on top so it is never hidden
  if (S.skin !== 'cosmic') {
    drawSpr(spr.top, top.x, top.y, 1 + top.flash*.05);
    drawSpr(spr.bot, bot.x, bot.y, 1 + bot.flash*.05);
    if (puckVisible) {
      ctx.globalAlpha = ghostT > 0 ? .6 : 1; drawSpr(spr.puck, puck.x, puck.y); ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(puck.x, puck.y); ctx.rotate(puck.a); ctx.drawImage(spr.mark.c, -rp, -rp, rp*2, rp*2); ctx.restore();
    }
  } else {
  {
    const R = rm*.95, s = R*2*(1 + top.flash*.04);
    ctx.save(); ctx.translate(top.x, top.y);
    if (IMG.corona) {
      ctx.globalCompositeOperation = 'lighter';
      const cs = R*1.4*(1 + Math.sin(clock*2.1)*.012);
      ctx.rotate(clock*.1); ctx.globalAlpha = .85; ctx.drawImage(IMG.corona, -cs, -cs, cs*2, cs*2);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.rotate(-clock*.1);
    }
    ctx.rotate(clock*.05); ctx.drawImage(spr.top.c, -s/2, -s/2, s, s);
    if (IMG.plasma) { // a slowly counter-rotating plasma layer makes the surface boil
      ctx.globalCompositeOperation = 'lighter';
      ctx.rotate(-clock*.17); ctx.globalAlpha = .42 + .1*Math.sin(clock*1.7); ctx.drawImage(IMG.plasma, -s/2, -s/2, s, s);

  drawSpr(spr.bot, bot.x, bot.y, 1 + bot.flash*.05);
  if (puckVisible) {
    const s = spr.star.s;
    ctx.globalAlpha = ghostT > 0 ? .6 : 1;
    ctx.save(); ctx.translate(puck.x, puck.y); ctx.rotate(puck.a*.5);
    ctx.drawImage(spr.star.c, -s/2, -s/2, s, s); ctx.restore(); ctx.globalAlpha = 1;
  }
  }

  // countdown

    ctx.font = `700 ${Math.round(3*u)}px Unbounded, system-ui, sans-serif`; ctx.fillStyle = COL.puck; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(fpsVal + ' FPS', L + 3*u, mid + 2*u);
  }
}

/* ---------- loop ---------- */
let last = performance.now();
const STEP = 1/240;
function frame(now){
  requestAnimationFrame(frame);
  if (S.mode === 'demo') { last = now; if (menuDirty) { menuDirty = false; render(); } return; }
  let dt = (now - last)/1000; last = now;
  if (!(dt > 0)) return; if (dt > .05) dt = .05;
  fpsAcc += dt; fpsFrames++; if (fpsAcc >= .5) { fpsVal = Math.round(fpsFrames/fpsAcc); fpsAcc = 0; fpsFrames = 0; }

  const running = S.state === 'play' || S.state === 'goal' || S.state === 'count';
  if (running) {
    clock += dt;
    if (S.state === 'count') {
      S.countT -= dt; const n = Math.ceil(S.countT/S.countStep);
      if (n < lastTick && n > 0) { if (S.mode !== 'demo') sfx('tick'); lastTick = n; }
      if (S.countT <= 0) { S.state = 'play'; puckActive = true; if (S.mode !== 'demo') { say('GO!', COL.puck, .8, 13); sfx('go'); buzz(15); } }
    }
    if (S.state === 'play') S.matchT += dt;
    if (!top.human) aiThink(top, dt);
    if (!bot.human) aiThink(bot, dt);
    top.sx = top.x; top.sy = top.y; bot.sx = bot.x; bot.sy = bot.y;
    if (top.grabT > 0) top.grabT -= dt; if (bot.grabT > 0) bot.grabT -= dt;
    const n = Math.min(12, Math.ceil(dt/STEP)), h = dt/n;
    for (let i = 0; i < n; i++) {
      const fr = (i+1)/n;
      if (top.human) moveHuman(top, h, fr); else moveAI(top, h);
      if (bot.human) moveHuman(bot, h, fr); else moveAI(bot, h);
      if (!puckActive) continue;
      const k = Math.exp(-FRICTION*h); puck.vx *= k; puck.vy *= k;
      puck.w *= Math.exp(-SPIN_DAMP*h);
      // spin bends the path slightly (Magnus-style curve)
      const cvx = -MAGNUS*puck.w*puck.vy*h, cvy = MAGNUS*puck.w*puck.vx*h; puck.vx += cvx; puck.vy += cvy;
      puck.x += puck.vx*h; puck.y += puck.vy*h; puck.a += puck.w*h;
      airCushion(h); hitMallet(top); hitMallet(bot); walls(); corners(); unpin(top); unpin(bot);
      const sp = Math.hypot(puck.vx, puck.vy), mx = PUCK_MAX*u;
      if (sp > mx) { puck.vx *= mx/sp; puck.vy *= mx/sp; }
      if (puck.y < T - rp) { scoreGoal(bot); break; } else if (puck.y > B + rp) { scoreGoal(top); break; }
    }
    if (ghostT > 0) ghostT = Math.max(0, ghostT - dt);
    if (puckActive && ghostT === 0 && inCorner()) { cornerT += dt; if (cornerT > .4) cornerEscape(); } else cornerT = 0;
    if (puckActive) {
      trail[trailHead*2] = puck.x; trail[trailHead*2+1] = puck.y; trailHead = (trailHead + 1) % TR; if (trailN < TR) trailN++;
      const owner = puck.y < mid - rp ? top : puck.y > mid + rp ? bot : null;
      if (owner && owner === halfOwner) halfT += dt; else { halfT = 0; halfOwner = owner; }
      if (S.state === 'play' && halfT > RULE_SECONDS) foul(halfOwner);
      if (Math.hypot(puck.vx, puck.vy) < 10*u && !halfOwner) { stuckT += dt; if (stuckT > 3) faceoff(Math.random() < .5 ? top : bot); } else stuckT = 0;
    }
    if (S.state === 'goal') { S.goalTimer -= dt; if (S.goalTimer <= 0) afterGoal(); }
  }
  if (S.state !== 'paused') {
    updParticles(dt);
    const fq = Math.exp(-5*dt); for (let q = 0; q < 4; q++) qFlash[q] *= fq;
    top.flash *= Math.exp(-7*dt); bot.flash *= Math.exp(-7*dt); shake *= Math.exp(-7*dt);
    if (ring) ring.t += dt; if (banner) banner.t += dt;
  }
  const frozen = S.state === 'paused' || (S.state === 'over' && pN === 0 && shake < .02 && Math.max(qFlash[0], qFlash[1], qFlash[2], qFlash[3]) < .02);
  if (!frozen || !stillDrawn) render();
  stillDrawn = frozen;
}

function applySkin(k){
  S.skin = k; const t = SKINS[k];
  COL.top = t.top; COL.bot = t.bot; COL.puck = t.puck;
